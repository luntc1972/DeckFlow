name: CI

# Build + test gate. Runs the .NET solution build, both xUnit suites, and the
# browser-side Vitest suite. The C# build invokes the local TypeScript compiler
# (node ./node_modules/typescript/bin/tsc via the CompileTypeScriptAssets MSBuild
# target), so `npm ci` MUST run before `dotnet build` to populate node_modules.
# Postgres + Scryfall integration tests self-skip unless their env flags are set,
# so no external services are required here.

on:
  push:
  pull_request:

jobs:
  # If branch protection requires named checks, include `format-gate` there.
  format-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Fetch origin/main for format gate base resolution
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Restore .NET dependencies
        run: dotnet restore DeckFlow.sln

      - name: Run changed-lines format gate
        run: bash scripts/format-check-changed.sh ci
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: DeckFlow.Web/package-lock.json

      - name: Install web npm deps (TypeScript compiler + Vitest)
        working-directory: DeckFlow.Web
        run: npm ci

      - name: Type-check Playwright E2E specs
        working-directory: DeckFlow.Web
        run: npm run typecheck:e2e

      - name: Restore .NET dependencies
        run: dotnet restore DeckFlow.sln

      - name: Build solution (compiles C# + browser TypeScript)
        run: dotnet build DeckFlow.sln -c Release --no-restore -nodeReuse:false

      - name: Run .NET tests (xUnit — Core + Web; PG/integration auto-skip)
        run: dotnet test DeckFlow.sln -c Release --no-build --verbosity normal -nodeReuse:false

      - name: Run browser TypeScript tests (Vitest + jsdom)
        working-directory: DeckFlow.Web
        run: npm test

      - name: Install Playwright browser
        working-directory: DeckFlow.Web
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright E2E smoke
        working-directory: DeckFlow.Web
        run: npm run e2e
        env:
          CI: 'true'
          FEEDBACK_ADMIN_USER: 'admin'
          FEEDBACK_ADMIN_PASSWORD: 'changeme-local'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: DeckFlow.Web/playwright-report/
